# ============ H2 文件数据库（本地与云端统一使用，数据持久化）============
# 激活方式：application.yml 默认 active: h2
# 特点：无需安装数据库；数据以文件形式保存在 ./data/ 目录，重启不丢失；启动自动建表 + 初始化导师账号。
spring:
  datasource:
    # 文件模式：数据持久化到 ./data/report_assistant.mv.db
    # MODE=MySQL 兼容 MySQL 语法；DB_CLOSE_ON_EXIT=FALSE 防止 JVM 退出时库被提前关闭
    url: jdbc:h2:file:./data/report_assistant;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      # 始终执行初始化脚本（脚本内部使用 IF NOT EXISTS / MERGE 保证幂等，不会覆盖已有数据）
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  # 打开 H2 web 控制台，浏览器访问 http://localhost:8080/h2-console 可看数据
  h2:
    console:
      enabled: true
      path: /h2-console
