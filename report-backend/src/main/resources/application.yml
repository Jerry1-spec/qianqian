server:
  # 云平台通常通过 PORT 环境变量注入端口（如 Render），本地默认 8080
  port: ${PORT:8080}

spring:
  # 默认激活 h2：本地零依赖演示（内存库，重启数据清空）。
  # 云端部署：设置环境变量 SPRING_PROFILES_ACTIVE=postgres（或 mysql）。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置：密钥与有效期均可通过环境变量覆盖，避免密钥硬编码进公开仓库。
jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 注入 >=32 字节的随机密钥
  secret: ${JWT_SECRET:report-assistant-v1-please-change-this-secret-key-32bytes-min}
  # 令牌有效期（毫秒）：默认 8 小时
  expire-millis: ${JWT_EXPIRE_MILLIS:28800000}

# 允许跨域的前端来源（生产环境设为前端公网地址，多个用逗号分隔）。默认 * 便于本地/演示。
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

---
# ============ MySQL 环境（本地持久化）============
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/report_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&tinyInt1isBit=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

---
# ============ PostgreSQL 环境（Render 等免费云 / 持久化）============
# 数据源连接全部来自环境变量，Render 会注入数据库连接信息。
# 首次部署时将 DB_INIT_MODE 设为 always 自动建表+初始化导师账号，之后可改回 never。
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    driver-class-name: org.postgresql.Driver
    # DB_URL 可留空：DatabaseUrlEnvironmentPostProcessor 会从 DATABASE_URL 解析并覆盖此三项
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: ${DB_INIT_MODE:never}
      schema-locations: classpath:schema-postgres.sql
      data-locations: classpath:data-postgres.sql
      continue-on-error: false
