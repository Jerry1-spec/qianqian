server:
  # 云平台通常通过 PORT 环境变量注入端口（如 Render），本地默认 8080
  port: ${PORT:8080}

spring:
  # 默认激活 h2：文件库，本地与云端统一使用，重启数据不丢失。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置：密钥与有效期均可通过环境变量覆盖，避免密钥硬编码进公开仓库。
jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 注入 >=32 字节的随机密钥
  secret: ${JWT_SECRET:report-assistant-v1-please-change-this-secret-key-32bytes-min}
  # 令牌有效期（毫秒）：默认 8 小时
  expire-millis: ${JWT_EXPIRE_MILLIS:28800000}

# 允许跨域的前端来源（一体化部署后前后端同源，默认 * 即可）。
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
