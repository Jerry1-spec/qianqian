# =====================================================================
# Render 一键部署蓝图（免费层，单服务一体化）
# 在 Render 控制台 New + → Blueprint，选中本仓库即可按此文件创建：
#   1) 一个免费 Web Service（Docker 构建，内含前端 + Spring Boot + H2 文件库）
#
# 注意事项：
#   - 免费层 15 分钟无访问会休眠，需用 UptimeRobot 等定时 ping 保活
#   - Render 免费实例无持久化磁盘，休眠/重启后 H2 数据文件会重置
#     （建表脚本幂等，重启后自动重建表 + 导师账号；学生/周报数据会丢）
#   - 保活后实例不休眠，数据可持续保存；仅在重新部署时重置
# =====================================================================

services:
  - type: web
    name: report-assistant
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # 免费层自动注入 PORT；JVM 参数已在 Dockerfile 中限制内存适配 512MB 实例
    envVars:
      # JWT 密钥随机生成（不写进仓库）
      - key: JWT_SECRET
        generateValue: true
