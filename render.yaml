# =====================================================================
# Render 部署蓝图（免费层）— 单后端服务 + 免费 PostgreSQL
# 前端页面通过 Capacitor 内置在手机 APP 中，无需单独部署前端。
# 免费层后端 15 分钟无访问休眠，冷启动约 30-60 秒。
# =====================================================================

databases:
  - name: report-db
    plan: free
    databaseName: report_assistant

services:
  - type: web
    name: report-backend
    runtime: docker
    plan: free
    rootDir: report-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # 首次部署自动建表 + 初始化导师账号；脚本幂等，不会破坏已有数据
      - key: DB_INIT_MODE
        value: always
      - key: DATABASE_URL
        fromDatabase:
          name: report-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: report-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: report-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      # Capacitor APP 内页面来源为 https://localhost
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://localhost
